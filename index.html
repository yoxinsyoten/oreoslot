
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101116">
  <title>オレオスロット</title>

  <style>
    /* ========================================
       1. 全体の基本デザイン
       ======================================== */
    :root {
      font-family: Inter, "Noto Sans JP", system-ui, sans-serif;
      color: #f7f7fa;
      background: #0e1015;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 18px;
      background: radial-gradient(
        ellipse at 50% 0%,
        #262a3a 0%,
        #101116 58%,
        #0b0c10 100%
      );
    }

    /* ========================================
       2. ゲーム本体のパネル
       ======================================== */
    .app {
      width: min(100%, 480px);
      border: 1px solid #343744;
      background: linear-gradient(150deg, #1e202a, #14161d 70%);
      border-radius: 10px;
      padding: 28px 24px 22px;
      box-shadow: 0 24px 85px #0008;
      overflow: hidden;
    }

    .eyebrow {
      color: #aaaebd;
      letter-spacing: .28em;
      font-size: 10px;
      font-weight: 800;
      margin: 0 0 8px;
      text-align: center;
    }

    .title {
      text-align: center;
      margin: 0;
      font-size: clamp(29px, 8vw, 42px);
      font-weight: 900;
      letter-spacing: .04em;
      line-height: 1.2;
    }

    .title span {
      color: #d7ff71;
    }

    .subtitle {
      text-align: center;
      color: #a4a8b6;
      font-size: 12px;
      margin: 10px 0 24px;
    }

    /* ========================================
       3. スロットマシン
       ======================================== */
    .machine {
      background: #0c0d12;
      border: 1px solid #393d4c;
      border-radius: 10px;
      padding: 15px;
      box-shadow: inset 0 3px 16px #0008;
    }

    .machine-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 3px 12px;
      color: #7e8597;
      font-size: 10px;
      letter-spacing: .12em;
      font-weight: 800;
    }

    .light {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #d7ff71;
      box-shadow: 0 0 13px #c7ff5a;
    }

    /* 3つのリールを横並びにする */
    .reels {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 9px;
      position: relative;
    }

    .reel {
      height: 128px;
      overflow: hidden;
      position: relative;
      background: linear-gradient(
        #d8dae1,
        #fff 30%,
        #fff 70%,
        #d8dae1
      );
      border-radius: 1px;
      box-shadow: inset 0 0 16px #87909a70;
    }

    /* 文字が縦に流れる部分 */
    .track {
      position: absolute;
      inset: 0;
      will-change: transform;
    }

    .glyph {
      height: 128px;
      display: grid;
      place-items: center;
      color: #171920;
      font-size: clamp(49px, 15vw, 76px);
      font-weight: 950;
      line-height: 1;
    }

    /* リール上下の陰影 */
    .reel::before,
    .reel::after {
      content: "";
      position: absolute;
      z-index: 2;
      left: 0;
      right: 0;
      height: 20px;
      pointer-events: none;
    }

    .reel::before {
      top: 0;
      background: linear-gradient(#17192042, transparent);
    }

    .reel::after {
      bottom: 0;
      background: linear-gradient(transparent, #17192042);
    }

    /* ========================================
       4. プレイ回数
       ======================================== */
    .stats {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 16px 2px 0;
      color: #969bab;
      font-size: 12px;
    }

    .stats strong {
      color: #f5f6f9;
      font-variant-numeric: tabular-nums;
      font-size: 20px;
      margin-left: 8px;
    }

    /* ========================================
       5. STARTボタン
       ======================================== */
    .controls {
      display: flex;
      justify-content: center;
      margin: 28px 0 18px;
    }

    .action {
      width: min(100%, 260px);
      height: 66px;
      border: 0;
      border-radius: 17px;
      background: #d7ff71;
      color: #171a0d;
      font-size: 20px;
      font-weight: 950;
      letter-spacing: .08em;
      cursor: pointer;
      box-shadow: 0 7px 0 #91a947, 0 13px 26px #0005;
      transition: transform .12s, box-shadow .12s;
      touch-action: manipulation;
    }

    .action:active:not(:disabled) {
      transform: translateY(5px);
      box-shadow: 0 2px 0 #91a947;
    }

    .action:disabled {
      cursor: default;
      opacity: .6;
    }

    .action small {
      display: block;
      font-size: 9px;
      letter-spacing: .13em;
      opacity: .65;
      margin-top: 3px;
    }

    /* ========================================
       6. 結果メッセージ
       ======================================== */
    .message {
      min-height: 53px;
      text-align: center;
      display: grid;
      place-items: center;
      color: #999eae;
      font-size: 12px;
      line-height: 1.7;
    }

    .message.win {
      color: #e5ffac;
      font-size: 18px;
      font-weight: 900;
    }

    /* ========================================
       7. X投稿ボタン
       成功したときだけ表示
       ======================================== */
    .share {
      display: none;
      width: 100%;
      padding: 16px;
      margin: 12px 0;
      border: 0;
      background: #f7f7fa;
      color: #171920;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .share.show {
      display: block;
    }

    /* ========================================
       8. もう一度遊ぶボタン
       成功したときだけ表示
       ======================================== */
    .again {
      display: none;
      width: 100%;
      padding: 16px;
      border: 1px solid #555b6a;
      background: #292d3a;
      color: white;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .again.show {
      display: block;
    }

    .foot {
      text-align: center;
      color: #606777;
      font-size: 10px;
      letter-spacing: .14em;
      margin-top: 20px;
    }

    /* ========================================
       9. 成功時の紙吹雪
       ======================================== */
    .confetti {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 10;
    }

    .confetti i {
      position: absolute;
      top: -20px;
      width: 9px;
      height: 15px;
      animation: fall var(--dur) linear forwards;
      transform: rotate(var(--rot));
      background: var(--c);
    }

    @keyframes fall {
      to {
        top: 110vh;
        transform: translateX(var(--dx)) rotate(850deg);
      }
    }

    /* ========================================
       10. スマートフォン対応
       ======================================== */
    @media (max-width: 380px) {
      .app {
        padding: 24px 16px;
      }

      .reel,
      .glyph {
        height: 105px;
      }

      .machine-top {
        font-size: 9px;
      }
    }
  </style>
</head>

<body>

  <!-- ========================================
       11. ゲーム画面のHTML
       ======================================== -->
  <main class="app">

    <!-- タイトル -->
    <p class="eyebrow"></p>

    <h1 class="title">
      オレオ<span>スロット</span>
    </h1>

    <p class="subtitle">
      君は1回でオレオを出すことができるか！
    </p>

    <!-- スロットマシン -->
    <section class="machine" aria-label="スロットマシン">

      <div class="machine-top">
        <span>
          <span class="light"></span>
          &nbsp;OREO MACHINE
        </span>
        <span>3 REELS / 2 LETTERS</span>
      </div>

      <!-- 3つのリール -->
      <div class="reels" id="reels">
        <div class="reel"><div class="track"></div></div>
        <div class="reel"><div class="track"></div></div>
        <div class="reel"><div class="track"></div></div>
      </div>

      <!-- プレイ回数 -->
      <div class="stats">
        <span>SPIN COUNT</span>
        <span>
          プレイ回数
          <strong id="count">0</strong>
        </span>
      </div>
    </section>

    <!-- STARTボタン -->
    <div class="controls">
      <button id="action" class="action" type="button">
        START
        <small>PRESS TO SPIN</small>
      </button>
    </div>

    <!-- 結果表示 -->
    <div class="message" id="message" aria-live="polite">
      ボタンを押して、オレオを揃えよう。
    </div>

    <!-- X投稿ボタン：成功時だけ表示 -->
    <button id="share" class="share" type="button">
      𝕏 結果をポストする
    </button>

    <!-- もう一度遊ぶ：成功時だけ表示 -->
    <button id="again" class="again" type="button">
      もう一度遊ぶ ↗
    </button>

    <div class="foot">アドベンドカレンダー2026/12/5</div>
  </main>

  <!-- 紙吹雪の表示領域 -->
  <div class="confetti" id="confetti"></div>

  <script>
    (() => {
      'use strict';

      /* ========================================
         12. ゲームの設定
         ここを変更すると動作を調整できる
         ======================================== */

      // 自動停止を始めるまでの回転時間
      // 1500 = 1.5秒、2000 = 2秒
      const AUTO_SPIN_MS = 300;

      // リールの回転速度
      const SPIN_SPEED = 0.02;

      // 各リールが減速して止まるまでの時間
      const STOP_DURATION = 500;

      // リール間の停止待機時間
      const STOP_GAP_MS = 100;

      // Xで共有するゲームのURL
      const GAME_URL =
        'https://yoxinsyoten.github.io/oreoslot/';

      /* ========================================
         13. HTML要素の取得
         ======================================== */
      const action = document.getElementById('action');
      const again = document.getElementById('again');
      const share = document.getElementById('share');
      const message = document.getElementById('message');
      const countEl = document.getElementById('count');
      const confetti = document.getElementById('confetti');

      const tracks = [
        ...document.querySelectorAll('.track')
      ];

      /* ========================================
         14. ゲームの状態管理
         ======================================== */

      // ready    = START待ち
      // spinning = 回転中
      // stopping = 停止処理中
      // won      = 成功
      let state = 'ready';

      // プレイ回数
      let count = 0;

      // アニメーション用の時刻
      let lastTime = 0;

      // 待機処理
      const sleep = ms =>
        new Promise(resolve => setTimeout(resolve, ms));

      // 各リールの状態
      const reels = tracks.map((el, i) => ({
        el,
        offset: i % 2,
        spinning: false,
        stopping: false,
        stopStart: 0,
        from: 0,
        to: 0,
        duration: 0,
        resolve: null
      }));

      /* ========================================
         15. リールの描画
         ======================================== */

      // リール1個分の高さ
      function reelHeight() {
        return document.querySelector('.reel').clientHeight;
      }

      // 現在の位置に合わせて文字を動かす
      function draw(reel) {
        const h = reelHeight();

        const v = ((reel.offset % 2) + 2) % 2;

        reel.el.style.transform =
          `translateY(${-((v + 2) * h)}px)`;
      }

      // 「オ」「レ」を交互に並べる
      function buildReels() {
        for (const reel of reels) {
          reel.el.innerHTML = '';

          for (let i = 0; i < 9; i++) {
            const glyph = document.createElement('div');

            glyph.className = 'glyph';
            glyph.textContent = i % 2 === 0 ? 'オ' : 'レ';

            reel.el.append(glyph);
          }

          draw(reel);
        }
      }

      /* ========================================
         16. リール回転アニメーション
         ======================================== */
      function loop(time) {
        const dt = Math.min(45, time - (lastTime || time));
        lastTime = time;

        for (const reel of reels) {

          if (reel.spinning) {
            // 回転中は一定速度で動かす
            reel.offset += dt * SPIN_SPEED;
            draw(reel);

          } else if (reel.stopping) {
            // 停止時は徐々に減速
            const progress = Math.min(
              1,
              (time - reel.stopStart) / reel.duration
            );

            const eased =
              1 - Math.pow(1 - progress, 3);

            reel.offset =
              reel.from +
              (reel.to - reel.from) * eased;

            draw(reel);

            if (progress >= 1) {
              reel.offset = reel.to;
              reel.stopping = false;
              draw(reel);

              if (reel.resolve) {
                reel.resolve();
                reel.resolve = null;
              }
            }
          }
        }

        requestAnimationFrame(loop);
      }

      /* ========================================
         17. リールを指定の文字で止める
         ======================================== */
      function reelStop(reel, index, target) {
        return new Promise(resolve => {

          reel.spinning = false;
          reel.stopping = true;

          reel.stopStart = performance.now();
          reel.duration = STOP_DURATION + index * 110;
          reel.from = reel.offset;

          const current = Math.ceil(reel.offset);

          // オ = 偶数、レ = 奇数
          const desired = target === 'オ' ? 0 : 1;

          let end = current + 8;

          if (end % 2 !== desired) {
            end++;
          }

          reel.to = end;
          reel.resolve = resolve;
        });
      }

      /* ========================================
         18. 成功時の紙吹雪
         ======================================== */
      function celebrate() {
        confetti.innerHTML = '';

        const colors = [
          '#d7ff71',
          '#ffb0a6',
          '#a2d7ff',
          '#ffffff',
          '#c5a7ff'
        ];

        for (let i = 0; i < 90; i++) {
          const piece = document.createElement('i');

          piece.style.left = Math.random() * 100 + '%';

          piece.style.setProperty(
            '--c',
            colors[i % colors.length]
          );

          piece.style.setProperty(
            '--dur',
            (2 + Math.random() * 2.5) + 's'
          );

          piece.style.setProperty(
            '--dx',
            ((Math.random() - 0.5) * 180) + 'px'
          );

          piece.style.setProperty(
            '--rot',
            Math.random() * 360 + 'deg'
          );

          piece.style.animationDelay =
            Math.random() * 0.65 + 's';

          confetti.append(piece);
        }

        // 紙吹雪を一定時間後に削除
        setTimeout(() => {
          confetti.innerHTML = '';
        }, 5400);
      }

      /* ========================================
         19. Xに結果を投稿する
         画像なし・テキストのみ
         ======================================== */
      function shareToX() {

        // 投稿文の形式：
        // 4回でオレオになりました！
        // #オレオスロット
        // https://yoxinsyoten.github.io/oreoslot/

        const text =
          `${count}回でオレオになりました！\n` +
          `#オレオスロット\n` +
          GAME_URL;

        const shareUrl =
          'https://twitter.com/intent/tweet?text=' +
          encodeURIComponent(text);

        window.open(
          shareUrl,
          '_blank',
          'noopener,noreferrer'
        );
      }

      /* ========================================
         20. STARTボタンを押したとき
         1回押すだけで自動停止
         ======================================== */
      async function onAction() {

        // 回転中・停止中・成功後は操作を受け付けない
        if (state !== 'ready') return;

        state = 'spinning';
        action.disabled = true;

        // プレイ回数を1増やす
        count++;
        countEl.textContent = count;

        // 3つのリールを同時に回転開始
        reels.forEach(reel => {
          reel.spinning = true;
        });

        // 指定した時間だけ回転
        await sleep(AUTO_SPIN_MS);

        state = 'stopping';

        // 各リールの結果をランダムに決定
        const result = Array.from(
          { length: 3 },
          () => Math.random() < 0.5 ? 'オ' : 'レ'
        );

        // 左から順番に停止
        for (let i = 0; i < 3; i++) {
          await reelStop(reels[i], i, result[i]);

          if (i < 2) {
            await sleep(STOP_GAP_MS);
          }
        }

        /* ====================================
           21. 当たり判定
           「オレオ」だけ成功
           ==================================== */
        if (result.join('') === 'オレオ') {

          state = 'won';

          // STARTボタンを隠す
          action.style.display = 'none';

          // 成功メッセージ
          message.classList.add('win');

          message.textContent =
            `おめでとう！${count}回でオレオになりました！`;

          // X投稿ボタンを表示
          share.classList.add('show');

          // もう一度遊ぶを表示
          again.classList.add('show');

          // 紙吹雪
          celebrate();

        } else {

          // 失敗時は特別な演出なし
          state = 'ready';

          action.innerHTML =
            'START<small>PRESS TO SPIN</small>';

          action.disabled = false;

          message.textContent = 'もう一度チャレンジ！';
        }
      }

      /* ========================================
         22. もう一度遊ぶ
         成功後に回数をリセット
         ======================================== */
      function resetGame() {

        state = 'ready';

        // プレイ回数を0に戻す
        count = 0;
        countEl.textContent = '0';

        // リールを初期位置へ戻す
        reels.forEach((reel, i) => {
          reel.offset = i % 2;
          reel.spinning = false;
          reel.stopping = false;
          draw(reel);
        });

        // STARTボタンを戻す
        action.style.display = '';
        action.disabled = false;

        action.innerHTML =
          'START<small>PRESS TO SPIN</small>';

        // 成功時の表示を消す
        share.classList.remove('show');
        again.classList.remove('show');
        message.classList.remove('win');

        message.textContent =
          'ボタンを押して、オレオを揃えよう。';

        confetti.innerHTML = '';
      }

      /* ========================================
         23. ボタンのイベント登録
         ======================================== */

      // STARTボタン
      action.addEventListener('click', onAction);

      // X投稿ボタン
      share.addEventListener('click', shareToX);

      // もう一度遊ぶ
      again.addEventListener('click', resetGame);

      // 画面サイズが変わったとき
      window.addEventListener('resize', () => {
        reels.forEach(draw);
      });

      /* ========================================
         24. ゲーム起動
         ======================================== */
      buildReels();
      requestAnimationFrame(loop);

    })();
  </script>

</body>
</html>
